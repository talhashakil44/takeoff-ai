# Keeps the experimental "fun" build (branch `fun`: fun mode, walk-through-walls) up to date
# with the app. Every push to main is merged into `fun`; nothing ever goes the other way.
# The fun build deploys on its own from that branch (Cloudflare Pages branch preview).
name: Update the fun build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fun-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fun
          fetch-depth: 0
      - name: Merge main into fun
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-edit origin/main; then
            git push origin fun
          else
            git merge --abort
            echo "::error::main no longer merges cleanly into fun; resolve it on the fun branch by hand."
            exit 1
          fi
