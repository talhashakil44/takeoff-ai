# Desktop app packaging (npm run desktop:mac / desktop:win; built by .github/workflows/desktop.yml).
appId: ca.mmaconstruction.takeoffai
productName: Takeoff AI
copyright: MMA Construction
directories:
  output: release
# The web app is already bundled into dist; the main process needs only Electron and Node.
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/**/*'
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  icon: public/icon-mac.png
  # Ad-hoc signed: no Apple developer account. macOS asks once before the first launch.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  artifactName: Takeoff-AI-Mac-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icon-512.png
nsis:
  artifactName: Takeoff-AI-Windows-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
# The stdio pipe AI apps run to reach the app's MCP server (electron/mcp-stdio.cjs), kept
# outside the app archive so the app's binary can run it as Node.
extraResources:
  - from: electron/mcp-stdio.cjs
    to: mcp-stdio.cjs
